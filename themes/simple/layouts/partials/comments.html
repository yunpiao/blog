<section id="blog-comments" aria-label="评论" aria-busy="true">
  {{ if eq .Layout "guestbook" }}
  <div class="guestbook-compose-heading">
    <div>
      <h2>写点什么</h2>
      <p>昵称必填，邮箱和网址选填。</p>
    </div>
    <button id="comments-retry" type="button">刷新页面</button>
  </div>
  <p id="comments-status" role="status" aria-live="polite">正在加载评论…</p>
  {{ else }}
  <p id="comments-status" role="status" aria-live="polite">正在加载评论…</p>
  <button id="comments-retry" type="button">重新加载页面</button>
  {{ end }}
  <div id="tcomment"></div>
  <noscript>请启用 JavaScript 后查看和发布评论。</noscript>
</section>
<script>
  (() => {
    const region = document.getElementById('blog-comments');
    const container = document.getElementById('tcomment');
    const status = document.getElementById('comments-status');
    const retry = document.getElementById('comments-retry');
    const serverURL = {{ .Site.Params.comments.serverURL }};
    const clientURL = {{ "js/vendor/twikoo-2.0.12.min.js" | relURL }};
    const capURL = {{ "js/vendor/cap-widget-0.1.58.min.js" | relURL }};
    const capWasmURL = {{ "js/vendor/cap-wasm-0.0.8.wasm" | relURL }};
    let loadTimer;

    {{ if eq .Layout "guestbook" }}
    function labelGuestbookInputs() {
      const labels = { nick: '昵称', mail: '邮箱', link: '网址' };
      container.querySelectorAll('.tk-submit input[name]').forEach((input) => {
        if (labels[input.name]) input.setAttribute('aria-label', labels[input.name]);
      });
      container.querySelectorAll('.tk-submit textarea').forEach((input) => {
        input.setAttribute('aria-label', '留言内容');
      });
    }
    {{ end }}

    function showFailure(message) {
      clearTimeout(loadTimer);
      region.setAttribute('aria-busy', 'false');
      status.textContent = message;
      status.hidden = false;
    }

    function loadScript(url, available) {
      if (available()) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.async = true;
        script.onload = () => {
          if (available()) resolve();
          else reject(new Error('Comment dependency unavailable'));
        };
        script.onerror = () => {
          script.remove();
          reject(new Error('Comment dependency failed to load'));
        };
        document.head.appendChild(script);
      });
    }

    // Twikoo reports list/request errors inside the widget after init has returned.
    new MutationObserver(() => {
      {{ if eq .Layout "guestbook" }}labelGuestbookInputs();{{ end }}
      if (container.querySelector('.tk-error')) {
        showFailure('评论请求失败，请查看下方错误信息后重试。');
      }
    }).observe(container, { childList: true, subtree: true });

    async function loadComments() {
      clearTimeout(loadTimer);
      region.setAttribute('aria-busy', 'true');
      status.textContent = '正在加载评论…';
      status.hidden = false;
      loadTimer = setTimeout(() => {
        showFailure('评论加载超时，请检查网络后重新加载页面。');
      }, 20000);
      try {
        window.CAP_CUSTOM_WASM_URL = new URL(capWasmURL, window.location.origin).href;
        await loadScript(capURL, () => Boolean(window.Cap));
        await loadScript(clientURL, () => Boolean(window.twikoo));
        await window.twikoo.init({
          envId: serverURL,
          el: '#tcomment',
          path: window.location.pathname,
          lang: 'zh-CN',
          onSubmit(payload) {
            if (!payload.capToken) {
              showFailure('评论验证配置未加载，请重新加载页面后发送。');
              throw new Error('评论验证配置未加载，请重新加载页面后发送。');
            }
          },
          onCommentLoaded() {
            clearTimeout(loadTimer);
            region.setAttribute('aria-busy', 'false');
            status.hidden = true;
          },
        });
      } catch (error) {
        console.error('评论加载失败', error);
        showFailure('评论加载失败，请检查网络后重试。');
      }
    }

    retry.addEventListener('click', () => window.location.reload());
    loadComments();
  })();
</script>
<style>
  #blog-comments {
    margin-top: 2rem;
    color: inherit;
  }
  #comments-status {
    font-size: 0.95rem;
  }
  #comments-retry {
    margin-bottom: 1rem;
    padding: 0.65rem 1rem;
    border: 1px solid currentColor;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #comments-retry:focus-visible,
  #tcomment button:focus-visible {
    outline: 2px solid #3b82f6;
    outline-offset: 3px;
  }
  #tcomment {
    font-size: 1rem;
  }
  #tcomment .tk-content img:not(.tk-owo-emotion) {
    max-width: min(300px, 100%);
    height: auto;
  }
  body.dark #blog-comments {
    color-scheme: dark;
    color: #e2e8f0;
  }
</style>
